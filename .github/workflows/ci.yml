# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds and tests Stem DAWg on Windows for every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine + tests (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # Dependencies (JUCE, ONNX Runtime, json, Catch2) are downloaded fresh by
      # FetchContent each run. Do not cache only the *-subbuild folders: their
      # stamp files would make CMake skip a download whose files are missing.
      - name: Configure
        run: cmake --preset vs2022-headless

      - name: Build
        run: cmake --build --preset headless-${{ matrix.config }}

      - name: Test
        run: ctest --preset headless-${{ matrix.config }}

  app:
    name: Desktop app (Qt)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake --preset vs2022 -DDAW_BUILD_TESTS=OFF
        env:
          DAW_QT_DIR: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset release
